name: autoinsight

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: autoinsight
      POSTGRES_USER: autoinsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Setup-Dev.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [services]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U autoinsight -d autoinsight"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run Setup-Dev.ps1 first}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks: [services]
    mem_limit: 128m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    environment:
      APP_ENV: development
      INFRASTRUCTURE_ENABLED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup first}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run setup first}
      RQ_QUEUE: autoinsight
      FILE_STORAGE_ROOT: /app/storage/artifacts
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b-q4_K_M}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-120}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.0}
      OLLAMA_MAX_OUTPUT_TOKENS: ${OLLAMA_MAX_OUTPUT_TOKENS:-1200}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-4096}
      LLM_THINKING: ${LLM_THINKING:-false}
      MAX_AGENT_STEPS: ${MAX_AGENT_STEPS:-12}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-all-minilm:22m}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-384}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-25000000}
      MAX_DOCUMENT_TEXT_BYTES: ${MAX_DOCUMENT_TEXT_BYTES:-5000000}
      MAX_DOCUMENT_PAGES: ${MAX_DOCUMENT_PAGES:-500}
      DOCUMENT_CHUNK_CHARS: ${DOCUMENT_CHUNK_CHARS:-800}
      DOCUMENT_CHUNK_OVERLAP: ${DOCUMENT_CHUNK_OVERLAP:-120}
      DOCUMENT_EMBED_BATCH_SIZE: ${DOCUMENT_EMBED_BATCH_SIZE:-8}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - ../storage/artifacts:/app/storage/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [services]
    mem_limit: 1g
    cpus: 1.0
    init: true
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, worker.healthcheck]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  redis_data:

networks:
  services:
    driver: bridge
