[project]
name = "autoinsight-backend"
version = "0.1.0"
description = "AutoInsight AI local API scaffold"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.3,<3",
    "fastapi>=0.143,<1",
    "httpx>=0.28,<1",
    "joblib>=1.5,<2",
    "langgraph>=1,<2",
    "numpy>=2,<3",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=6,<8",
    "rq>=2.6,<3",
    "scikit-learn>=1.7,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
 "pytest>=9,<10",
 "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = ["integration: requires the isolated running AutoInsight infrastructure"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
