[project]
name = "autoinsight-backend"
version = "0.1.0"
description = "AutoInsight AI local API scaffold"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.143,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "redis>=6,<8",
    "rq>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=9,<10", "ruff>=0.14,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not integration'"
markers = ["integration: requires the isolated running AutoInsight infrastructure"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
